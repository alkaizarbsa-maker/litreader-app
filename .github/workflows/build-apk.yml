name: Build LitReader APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Unpack project
        run: |
          ZIP="$(ls -t *.zip | head -n 1)"
          if [ -z "$ZIP" ]; then echo "No .zip found in repo root"; exit 1; fi
          echo "Unpacking $ZIP"
          rm -rf project
          unzip -o "$ZIP" -d project
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build debug APK
        run: gradle -p project :app:assembleRelease --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: litreader-apk
          path: project/app/build/outputs/apk/release/app-release.apk
